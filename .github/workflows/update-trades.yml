name: Update trade data

# Frequent refresh: new PTR filings + ticker classification + flags.
# This is the workflow used day-to-day; the full roster resync lives in
# update-roster.yml and runs far less often.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-trades:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trades pipeline
        run: python scripts/run_pipeline.py --mode trades

      - name: Commit updated data
        run: |
          if git status --porcelain docs/data | grep -q .; then
            git config user.name "senate-stock-watch-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/data/
            COUNTS=$(python -c "import json; c=json.load(open('docs/data/meta.json'))['counts']; print(f\"trades={c['trades_total']} flags={c['flags_total']}\")")
            git commit -m "data: automated trade refresh ($COUNTS)"
            git pull --rebase
            git push
          else
            echo "No data changes - skipping commit."
          fi
