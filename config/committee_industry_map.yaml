    keywords: ["tribal", "casino", "gaming"]
    confidence: medium

  - committee_id: SLIN
    committee_name: "Select Committee on Intelligence"
    category: "Intelligence & Defense Contracting"
    sic_prefixes: ["3812", "7379", "8742"]
    keywords: ["intelligence", "surveillance", "defense contractor"]
    confidence: medium

  - committee_id: SPAG
    committee_name: "Special Committee on Aging"
    category: "Senior Health, Insurance & Long-Term Care"
    sic_prefixes: ["8051", "2834", "6321"]
    keywords: ["nursing home", "long-term care", "medicare", "senior living"]
    confidence: medium

  - committee_id: SLET
    committee_name: "Select Committee on Ethics"
    excluded_from_matching: true
    exclusion_reason: >
      Oversees Senate member conduct itself, not any external industry.

  - committee_id: SCNC
    committee_name: "Caucus on International Narcotics Control"
    excluded_from_matching: true
    exclusion_reason: >
      An informal caucus (not a standing committee with legislative
      jurisdiction) focused on drug policy broadly rather than a
      tradeable industry sector.
